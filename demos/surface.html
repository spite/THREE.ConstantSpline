<!doctype html>
<html lang="en">
	<head>
		<title>THREE.ConstantSpline.js Demo - Surfaces</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700,300" rel="stylesheet" type="text/css">
		<style>
			*{ box-sizing: border-box; margin: 0; padding: 0;}
			body{ background-color: black; overflow: hidden;}
			canvas{ display: block; }
			div{ font-family: 'Roboto condensed', sans-serif; color: #fff; font-weight: 100; font-size: 13px; position: absolute; left: 20px; top: 20px;}
			a{ color: inherit; }
		</style>
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
		</script>
	</head>
<body>
<div>
	<p><b>THREE.ConstantSpline.js demo - Surfaces</b></p>
	<p>Click space or tap the screen to create a new surface | click or touch and drag to rotate</p>
	<p><a href="lines.html">Lines</a> | <a href="https://github.com/spite/THREE.ConstantSpline">GitHub</a></p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConstantSpline } from '../src/THREE.ConstantSpline.js';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog( 0, 0, 100 );

const camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, .01, 200 );
camera.position.setFromSphericalCoords( 35, THREE.MathUtils.degToRad( 73 ), THREE.MathUtils.degToRad( - 20 ) );

const renderer = new THREE.WebGLRenderer( { antialias: true } );
renderer.setPixelRatio( window.devicePixelRatio );
renderer.setSize( window.innerWidth, window.innerHeight );
document.body.appendChild( renderer.domElement );

const controls = new OrbitControls( camera, renderer.domElement );
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 10;
controls.maxDistance = 100;

const lineMaterial = new THREE.LineBasicMaterial( { color: 0xffffff } );
const material = new THREE.MeshNormalMaterial( { side: THREE.DoubleSide, flatShading: true } );

const s = new ConstantSpline();
const random = () => new THREE.Vector3( .5 - Math.random(), .5 - Math.random(), .5 - Math.random() ).multiplyScalar( ( .5 - Math.random() ) * 80 );

let mesh = null;
let lines = [];

// a surface between two curves: each row is a curve in between, as points evenly spaced along it
function createSurface() {

	if ( mesh ) {

		scene.remove( mesh );
		mesh.geometry.dispose();

	}

	lines.forEach( function ( l ) {

		scene.remove( l );
		l.geometry.dispose();

	} );
	lines = [];

	const first = [ random(), random(), random(), random() ];
	const second = [ random(), random(), random(), random() ];

	const steps = 30, segments = 60;
	const positions = [];

	for ( let i = 0; i < steps; i ++ ) {

		const t = i / steps;

		s.p0.lerpVectors( first[ 0 ], second[ 0 ], t );
		s.p1.lerpVectors( first[ 1 ], second[ 1 ], t );
		s.p2.lerpVectors( first[ 2 ], second[ 2 ], t );
		s.p3.lerpVectors( first[ 3 ], second[ 3 ], t );

		s.p0.z = - 10; s.p3.z = 10;
		s.p0.x = s.p1.x = s.p2.x = s.p3.x = ( i - .5 * steps ) * 20 / steps;

		s.calculate();
		s.reticulate( { steps: segments } );

		const line = new THREE.Line( new THREE.BufferGeometry().setFromPoints( s.lPoints ), lineMaterial );
		scene.add( line );
		lines.push( line );

		for ( const p of s.lPoints ) positions.push( p.x, p.y, p.z );

	}

	// a plane with a vertex for every point
	const geometry = new THREE.PlaneGeometry( 1, 1, segments, steps - 1 );
	geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );
	geometry.computeVertexNormals();

	mesh = new THREE.Mesh( geometry, material );
	scene.add( mesh );

}

let isTap = false, tapX, tapY;

window.addEventListener( 'touchstart', function ( e ) {

	isTap = e.touches.length === 1;
	tapX = e.touches[ 0 ].clientX;
	tapY = e.touches[ 0 ].clientY;

} );

window.addEventListener( 'touchmove', function ( e ) {

	if ( Math.abs( e.touches[ 0 ].clientX - tapX ) > 10 || Math.abs( e.touches[ 0 ].clientY - tapY ) > 10 ) isTap = false;

} );

window.addEventListener( 'touchend', function () {

	if ( isTap ) createSurface();
	isTap = false;

} );

window.addEventListener( 'keydown', function ( e ) {

	if ( e.code === 'Space' ) createSurface();

} );

window.addEventListener( 'resize', function () {

	renderer.setSize( window.innerWidth, window.innerHeight );
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();

} );

function render() {

	requestAnimationFrame( render );
	controls.update();
	renderer.render( scene, camera );

}

createSurface();
render();
</script>
</body>
</html>
