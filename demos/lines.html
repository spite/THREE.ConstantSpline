<!doctype html>
<html lang="en">
	<head>
		<title>THREE.ConstantSpline.js Demo - Lines</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700,300" rel="stylesheet" type="text/css">
		<style>
			*{ box-sizing: border-box; margin: 0; padding: 0;}
			body{ background-color: black; overflow: hidden;}
			canvas{ display: block; }
			div{ font-family: 'Roboto condensed', sans-serif; color: #fff; font-weight: 100; font-size: 13px; position: absolute; left: 20px; top: 20px;}
			a{ color: inherit; }
		</style>
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
		</script>
	</head>
<body>
<div>
	<p><b>THREE.ConstantSpline.js demo - Lines</b></p>
	<p>Click space or touch the screen to add more lines</p>
	<p><a href="surface.html">Surfaces</a> | <a href="https://github.com/spite/THREE.ConstantSpline">GitHub</a></p>
</div>
<script type="module">
import * as THREE from 'three';
import { ConstantSpline } from '../src/THREE.ConstantSpline.js';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog( 0, 0, 100 );

const camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, .01, 100 );
camera.position.z = 20;
const target = new THREE.Vector3();

const renderer = new THREE.WebGLRenderer( { antialias: true } );
renderer.setPixelRatio( window.devicePixelRatio );
renderer.setSize( window.innerWidth, window.innerHeight );
document.body.appendChild( renderer.domElement );

const pointer = new THREE.Mesh( new THREE.IcosahedronGeometry( 0.1, 2 ), new THREE.MeshBasicMaterial( { color: 0xffffff } ) );
pointer.scale.setScalar( 4 );
scene.add( pointer );

const s = new ConstantSpline();
const origin = new THREE.Vector3( 0, 0, 0 );
const random = () => new THREE.Vector3( .5 - Math.random(), .5 - Math.random(), .5 - Math.random() ).multiplyScalar( 10 + Math.random() * 50 );

let lines = [];
let points = [];

// a curve that starts where the last one ended, as points that are .1 apart
function createLine() {

	s.inc = .001;

	s.p0.copy( origin );
	s.p1 = random();
	s.p2 = random();
	s.p3 = random();

	s.calculate();
	s.reticulate( { distancePerStep: .1 } );

	const material = new THREE.LineBasicMaterial( { color: Math.floor( 0x404040 + Math.random() * 0xbfbfbf ) } );

	const line = new THREE.Line( new THREE.BufferGeometry().setFromPoints( s.lPoints ), material );
	line.pointCount = s.lPoints.length;
	scene.add( line );
	lines.push( line );

	points = points.concat( s.lPoints );

	origin.copy( s.p3 );

}

window.addEventListener( 'touchstart', createLine );

window.addEventListener( 'keydown', function ( e ) {

	if ( e.code === 'Space' ) createLine();

} );

window.addEventListener( 'resize', function () {

	renderer.setSize( window.innerWidth, window.innerHeight );
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();

} );

const tmpPoint = new THREE.Vector3();
const camPoint = new THREE.Vector3();
const speed = 50;
const lag = 2000;
const maxLines = 200;

// the points are at a constant distance, so going through them at a constant rate is a constant speed
function samplePoints( time ) {

	let t = Math.floor( time / speed );
	const f = ( time % speed ) / speed;
	t %= points.length - 1;

	return tmpPoint.copy( points[ t ] ).lerp( points[ t + 1 ], f );

}

let t = 0, lastTime = 0;

function removeOldLines() {

	// only lines the camera has already passed
	while ( lines.length > maxLines && lines[ 0 ].pointCount * speed <= t - lag ) {

		const line = lines.shift();
		scene.remove( line );
		line.geometry.dispose();
		line.material.dispose();
		points.splice( 0, line.pointCount );
		t -= line.pointCount * speed;

	}

}

function render() {

	requestAnimationFrame( render );

	// frames elapsed at 60fps, so the pace is the same at any refresh rate
	const time = performance.now();
	const frames = lastTime ? Math.min( ( time - lastTime ) * 60 / 1000, 4 ) : 1;
	lastTime = time;

	t += 100 * frames;

	if ( ( t / speed ) >= points.length - 1 ) createLine();

	removeOldLines();

	camPoint.copy( samplePoints( Math.max( 0, t - lag ) ) );
	camPoint.y += 10;
	camera.position.lerp( camPoint, 1 - Math.pow( .99, frames ) );

	pointer.position.copy( samplePoints( t ) );
	target.lerp( pointer.position, 1 - Math.pow( .9, frames ) );

	camera.lookAt( target );
	camera.rotation.z += .1;

	renderer.render( scene, camera );

}

createLine();
render();
</script>
</body>
</html>
